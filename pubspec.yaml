name: internee_app
description: "Internee.pk Learning App - Browse LMS courses, watch lectures, and attempt quizzes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase - for authentication
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2

  # HTTP - for calling the Internee.pk LMS REST API
  http: ^1.4.0

  # Video player - for YouTube lecture videos
  youtube_player_iframe: ^6.0.2

  # Shared preferences - to save simple local data (login state, etc.)
  shared_preferences: ^2.5.3


  # Google Fonts - for a clean modern font
  google_fonts: ^6.2.1

  # Cached network image - for loading course images efficiently
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
